# Background
background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 2
    blur_size = 4
    contrast = 0.9
    brightness = 0.25
    vibrancy = 0.15
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = false
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.6)
    font_size = 16
    font_family = JetBrains Mono Nerd Font Propo

    position = 0, 190
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 110
    font_family = JetBrains Mono Nerd Font Propo

    position = 0, 100
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.4)
    font_size = 13
    font_family = JetBrains Mono Nerd Font Propo

    position = 0, -10
    halign = center
    valign = center
}

# Input-field
input-field {
    monitor =
    size = 240, 44
    outline_thickness = 1

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(10, 10, 10, 0)
    font_color = rgb(255, 255, 255)
    check_color = rgba(255, 255, 255, 0.2)
    fail_color = rgba(255, 255, 255, 0.5)

    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font Propo
    placeholder_text = <span foreground="##ffffff55">󰌾</span>
    fail_text = <span foreground="##ffffff88">$FAIL</span>
    hide_input = false

    position = 0, -80
    halign = center
    valign = center
    rounding = -1
}

# Buttons
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.6)
    font_size = 40
    font_family = JetBrains Mono Nerd Font Propo
    onclick = reboot now
    position = 40, 100
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.6)
    font_size = 40
    font_family = JetBrains Mono Nerd Font Propo
    onclick = shutdown now
    position = -40, 100
    halign = center
    valign = bottom
}