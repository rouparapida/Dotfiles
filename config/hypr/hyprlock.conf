background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 2
    blur_size = 4
    contrast = 0.9
    brightness = 0.25
    vibrancy = 0.15
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = false
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 1

    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgb(255, 255, 255)
    inner_color = rgba(10, 10, 10, 0)
    font_color = rgb(255, 255, 255)
    check_color = rgba(255, 255, 255, 0.2)
    fail_color = rgba(255, 255, 255, 0.5)

    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font Propo

    placeholder_text = <i><span foreground="##ffffff66">󰌾  Password...</span></i>

    hide_input = false

    position = 0, -100
    halign = center
    valign = center
    rounding = 100
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 100
    font_family = JetBrains Mono Nerd Font Propo

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Propo

    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.5)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Propo

    position = 0, -40
    halign = center
    valign = center
}

shape {
    monitor =
    size = 50, 50
    color = rgba(10, 10, 10, 0)
    rounding = -1
    border_size = 1
    border_color = rgb(255, 255, 255)

    position = -40, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = JetBrains Mono Nerd Font Propo
    onclick = systemctl poweroff

    position = -40, -180
    halign = center
    valign = center
}

shape {
    monitor =
    size = 50, 50
    color = rgba(10, 10, 10, 0)
    rounding = -1
    border_size = 1
    border_color = rgb(255, 255, 255)

    position = 40, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = JetBrains Mono Nerd Font Propo
    onclick = systemctl reboot

    position = 40, -180
    halign = center
    valign = center
}